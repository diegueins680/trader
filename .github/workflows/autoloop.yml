name: Autoloop

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Override the OpenAI model slug"
        required: false
        type: string
      max_iterations:
        description: "Maximum local repair iterations before giving up"
        required: false
        default: "2"
        type: string
      dry_run:
        description: "Run proposal/verification without committing or pushing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: autoloop-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  autoloop:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Require dedicated push token
        env:
          AUTOLOOP_PUSH_TOKEN: ${{ secrets.AUTOLOOP_PUSH_TOKEN }}
        run: |
          if [[ -z "${AUTOLOOP_PUSH_TOKEN:-}" ]]; then
            echo "::error::AUTOLOOP_PUSH_TOKEN is required so autoloop pushes trigger downstream CI and can poll GitHub Actions to repair failures."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOLOOP_PUSH_TOKEN }}

      - uses: haskell/ghcup-setup@v1
        with:
          ghc: "9.4.8"
          cabal: "3.12.1.0"

      - name: Cache Cabal artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            haskell/dist-newstyle
          key: ${{ runner.os }}-autoloop-cabal-${{ hashFiles('haskell/trader.cabal') }}
          restore-keys: |
            ${{ runner.os }}-autoloop-cabal-

      - name: Warm Cabal index
        working-directory: haskell
        run: cabal update

      - name: Install HLint
        run: sudo apt-get update && sudo apt-get install -y hlint

      - name: Install fourmolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location \
            https://github.com/fourmolu/fourmolu/releases/download/v0.15.0.0/fourmolu-0.15.0.0-linux-x86_64 \
            --output "$HOME/.local/bin/fourmolu"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show fourmolu version
        run: fourmolu --version

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: haskell/web/package-lock.json

      - name: Install web dependencies
        working-directory: haskell/web
        run: npm --workspaces=false ci

      - name: Run autoloop
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOLOOP_PUSH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOLOOP_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          # Pin the Anthropic planner model explicitly. The empty fallback caused
          # the loop to drift onto whatever Anthropic's default was, which
          # silently broke when newer models stopped accepting assistant-message
          # prefill. Workflow_dispatch and repo `vars.AUTOLOOP_MODEL` can still
          # override.
          AUTOLOOP_MODEL: ${{ github.event.inputs.model || vars.AUTOLOOP_MODEL || 'claude-opus-4-8' }}
          AUTOLOOP_MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || vars.AUTOLOOP_MAX_ITERATIONS || '2' }}
        run: |
          if [[ -z "${ANTHROPIC_API_KEY:-}" && -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::warning::Neither ANTHROPIC_API_KEY nor OPENAI_API_KEY is set; skipping autoloop."
            exit 0
          fi
          if [[ "${{ github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            npm run autoloop -- --dry-run
          else
            npm run autoloop
          fi
