name: Autoloop

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Override the OpenAI model slug"
        required: false
        type: string
      max_iterations:
        description: "Maximum local repair iterations before giving up"
        required: false
        default: "2"
        type: string
      dry_run:
        description: "Run proposal/verification without committing or pushing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: autoloop-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autoloop:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"

      - name: Cache Cabal artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            haskell/dist-newstyle
          key: ${{ runner.os }}-autoloop-cabal-${{ hashFiles('haskell/trader.cabal') }}
          restore-keys: |
            ${{ runner.os }}-autoloop-cabal-

      - name: Warm Cabal index
        working-directory: haskell
        run: cabal update

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: haskell/web/package-lock.json

      - name: Install web dependencies
        working-directory: haskell/web
        run: npm --workspaces=false ci

      - name: Run autoloop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOLOOP_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOLOOP_MODEL: ${{ github.event.inputs.model || vars.AUTOLOOP_MODEL }}
          AUTOLOOP_MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || vars.AUTOLOOP_MAX_ITERATIONS || '2' }}
        run: |
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::warning::OPENAI_API_KEY is not set; skipping autoloop."
            exit 0
          fi
          if [[ "${{ github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            npm run autoloop -- --dry-run
          else
            npm run autoloop
          fi
