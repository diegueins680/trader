name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  haskell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haskell
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.8"

      - name: Cache Cabal artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            haskell/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('haskell/trader.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - run: cabal update
      - name: Install HLint
        run: sudo apt-get update && sudo apt-get install -y hlint
      - name: Install fourmolu
        run: |
          cabal install fourmolu-0.15.0.0 \
            --installdir="$HOME/.local/bin" \
            --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show fourmolu version
        run: fourmolu --version
      - name: Check Haskell formatting
        run: |
          find app test bench -name '*.hs' -print0 | xargs -0 fourmolu --mode check
      - run: hlint app test bench
      - run: cabal build
      - run: bash scripts/ci_smoke.sh
      - run: cabal test --test-show-details=direct

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build:web

  deploy:
    name: Deploy (Fly.io)
    runs-on: ubuntu-latest
    needs: [haskell, web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy (Fly.io)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
        run: |
          set -euo pipefail
          auth_err_file="$(mktemp)"
          trap 'rm -f "$auth_err_file"' EXIT

          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "::warning::FLY_API_TOKEN is not set; skipping Fly deploy."
            exit 0
          fi

          if ! flyctl auth whoami >"$auth_err_file" 2>&1; then
            if grep -qiE "missing third-party discharge token|invalid token" "$auth_err_file"; then
              echo "::warning::FLY_API_TOKEN is invalid for CI deploy (missing Fly discharge token). Generate a deploy token with 'fly tokens create deploy' and update the FLY_API_TOKEN GitHub secret; skipping Fly deploy."
              exit 0
            fi
            echo "::error::Fly authentication failed before deploy."
            cat "$auth_err_file"
            exit 1
          fi

          if [[ -n "${FLY_APP:-}" ]]; then
            flyctl deploy --remote-only --app "${FLY_APP}"
          elif [[ -f fly.toml ]]; then
            flyctl deploy --remote-only
          else
            echo "::warning::No FLY_APP secret and no fly.toml found; skipping Fly deploy."
          fi
