name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell/ghcup-setup@v1
        with:
          ghc: "9.4.8"
          cabal: latest

      - name: Restore Cabal cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            haskell/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('haskell/trader.cabal') }}-${{ hashFiles('haskell/app/**') }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ hashFiles('haskell/trader.cabal') }}-
            ${{ runner.os }}-cabal-

      - name: Install system dependencies and dev tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hlint
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location \
            https://github.com/fourmolu/fourmolu/releases/download/v0.15.0.0/fourmolu-0.15.0.0-linux-x86_64 \
            --output "$HOME/.local/bin/fourmolu"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show fourmolu version
        run: fourmolu --version

      - run: cd haskell && cabal update
      - run: bash scripts/verify.sh haskell

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: haskell/web/package-lock.json

      - run: npm --workspaces=false --prefix haskell/web ci
      - run: bash scripts/verify.sh web

  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - run: bash scripts/verify.sh automation

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [haskell, web, automation]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache Docker image layers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-to: type=gha,mode=max
          cache-from: type=gha

  deploy:
    name: Deploy (Fly.io)
    runs-on: ubuntu-latest
    needs: [haskell, web, automation, build-docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install flyctl
        id: setup_flyctl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "::notice::FLY_API_TOKEN is not set; skipping flyctl install because deploy will be skipped."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          install_log="$(mktemp)"
          install_script="$(mktemp)"
          trap 'rm -f "$install_log" "$install_script"' EXIT

          installed=false
          for attempt in 1 2 3; do
            : > "$install_log"
            if curl --fail --silent --show-error --location \
              https://fly.io/install.sh >"$install_script" 2>"$install_log"; then
              if FLYCTL_INSTALL="$HOME/.fly" bash "$install_script" >>"$install_log" 2>&1; then
                installed=true
                break
              fi
            fi

            if grep -qiE "503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|timed out|temporary failure|connection reset|TLS" "$install_log"; then
              echo "::warning::Transient flyctl install failure on attempt ${attempt}; retrying."
              sleep "$((attempt * 10))"
              continue
            fi

            echo "::error::Failed to install flyctl."
            cat "$install_log"
            exit 1
          done

          if [[ "$installed" != true || ! -x "$HOME/.fly/bin/flyctl" ]]; then
            echo "::warning::Unable to install flyctl after 3 attempts; skipping Fly deploy for this run."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy (Fly.io)
        if: steps.setup_flyctl.outputs.installed == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_API_TOKEN_FRONTEND: ${{ secrets.FLY_API_TOKEN_FRONTEND }}
          FLY_API_TOKEN_RESEARCH: ${{ secrets.FLY_API_TOKEN_RESEARCH }}
          BACKEND_FLY_APP: ${{ secrets.FLY_APP }}
          FRONTEND_FLY_APP: ${{ secrets.FLY_FRONTEND_APP }}
          RESEARCH_FLY_APP: ${{ secrets.FLY_RESEARCH_APP }}
        run: |
          set -euo pipefail
          auth_err_file="$(mktemp)"
          deploy_log="$(mktemp)"
          trap 'rm -f "$auth_err_file" "$deploy_log"' EXIT

          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "::warning::FLY_API_TOKEN is not set; skipping Fly deploy."
            exit 0
          fi

          if ! flyctl auth whoami >"$auth_err_file" 2>&1; then
            if grep -qiE "missing third-party discharge token|invalid token|must be authenticated" "$auth_err_file"; then
              echo "::warning::FLY_API_TOKEN is invalid for CI deploy (missing Fly discharge token). Generate a deploy token with 'fly tokens create deploy' and update the FLY_API_TOKEN GitHub secret; skipping Fly deploy."
              exit 0
            fi
            echo "::error::Fly authentication failed before deploy."
            cat "$auth_err_file"
            exit 1
          fi

          deploy_with_retries() {
            local label="$1"
            local workdir="$2"
            local config_path="$3"
            local app_name="$4"
            local token_override="${5:-}"
            local token_secret_name="${6:-FLY_API_TOKEN}"
            local unauthorized_annotation="${7:-error}"
            local config_basename
            local app_display

            if [[ ! -f "$config_path" ]]; then
              echo "::notice::No ${label} Fly config at ${config_path}; skipping ${label} deploy."
              return 0
            fi

            config_basename="$(basename "$config_path")"
            app_display="$app_name"
            if [[ -z "$app_display" ]]; then
              app_display="$(awk -F'"' '/^app = / { print $2; exit }' "$config_path")"
            fi
            if [[ -z "$app_display" ]]; then
              app_display="the app configured in ${config_basename}"
            fi
            pushd "$workdir" >/dev/null

            local deploy_args=(deploy . --config "$config_basename" --remote-only)
            deploy_args+=(--build-arg "TRADER_GIT_COMMIT=${GITHUB_SHA}")
            if [[ -n "$app_name" ]]; then
              deploy_args+=(--app "$app_name")
            fi

            # Per-deploy token override: Fly app-scoped deploy tokens
            # only carry a discharge for a single app, but we need to
            # deploy multiple apps. Pass a per-call override
            # so each deploy sees the token authorized for that app.
            local token_env=()
            if [[ -n "$token_override" ]]; then
              token_env=(env -u FLY_APP "FLY_API_TOKEN=${token_override}")
            else
              token_env=(env -u FLY_APP)
            fi

            for attempt in 1 2 3; do
              : > "$deploy_log"
              if "${token_env[@]}" flyctl "${deploy_args[@]}" 2>&1 | tee "$deploy_log"; then
                popd >/dev/null
                return 0
              fi

              if grep -qiE "503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|failed to set release status|temporary failure|temporarily unavailable|timeout" "$deploy_log"; then
                if [[ "$attempt" -lt 3 ]]; then
                  echo "::warning::Transient ${label} Fly deploy failure on attempt ${attempt}; retrying."
                  sleep "$((attempt * 20))"
                  continue
                fi
                echo "::warning::${label} Fly deploy hit repeated transient upstream failures after ${attempt} attempts; skipping ${label} deploy for this run."
                popd >/dev/null
                return 0
              fi

              if grep -qiE "unauthorized|not authorized|permission denied|access denied" "$deploy_log"; then
                echo "::${unauthorized_annotation}::${label} Fly deploy is unauthorized for ${app_display}. Set GitHub secret ${token_secret_name} to a Fly deploy token scoped to that app: fly tokens create deploy -a ${app_display}"
                cat "$deploy_log"
                popd >/dev/null
                return 1
              fi

              if grep -qiE "overdue invoices|update your payment information" "$deploy_log"; then
                echo "::warning::${label} Fly deploy is blocked by Fly billing state; update Fly billing information and rerun deploy. Skipping ${label} deploy for this run."
                popd >/dev/null
                return 0
              fi

              echo "::error::${label} Fly deploy failed."
              cat "$deploy_log"
              popd >/dev/null
              return 1
            done

            popd >/dev/null
          }

          deploy_with_retries "backend" "." "fly.toml" "${BACKEND_FLY_APP:-}" "${FLY_API_TOKEN}" "FLY_API_TOKEN" "error"
          # Research producer app (optimizer discovery). App-scoped deploy
          # tokens carry a single app's discharge, so prefer a dedicated
          # research token when configured and fall back to the primary one.
          # Non-fatal: a missing/under-scoped research token must not fail the
          # backend deploy or the Hetzner deploy workflow that keys off this run.
          deploy_with_retries "research" "." "fly.research.toml" "${RESEARCH_FLY_APP:-trader-hs-research}" "${FLY_API_TOKEN_RESEARCH:-${FLY_API_TOKEN}}" "FLY_API_TOKEN_RESEARCH" "warning" ||
            echo "::warning::research Fly deploy failed; set an app-scoped FLY_API_TOKEN_RESEARCH secret (fly tokens create deploy -a trader-hs-research)."
          # If a frontend-specific token is configured (recommended,
          # because Fly app-scoped deploy tokens carry a discharge for
          # only one app), use it; otherwise fall back to the primary
          # FLY_API_TOKEN and rely on org-level authorization.
          deploy_with_retries "frontend" "haskell/web" "haskell/web/fly.frontend.toml" "${FRONTEND_FLY_APP:-}" "${FLY_API_TOKEN_FRONTEND:-${FLY_API_TOKEN}}" "FLY_API_TOKEN_FRONTEND" "error"
