name: Deploy (Hetzner)

# Runs after the CI workflow finishes. Because it keys off the whole CI run's
# conclusion, it only deploys when every other CI job (haskell, web, automation)
# was green for that commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose latest successful CI commit should be redeployed."
        required: false
        default: "main"
        type: choice
        options:
          - main
          - master

# Never let two deploys to the same box race; let an in-flight deploy finish.
concurrency:
  group: deploy-hetzner-${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-deploy:
    name: Resolve deploy commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      deploy_branch: ${{ steps.resolve.outputs.deploy_branch }}
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Resolve latest green commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail

          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            workflow_run)
              branch="$WORKFLOW_RUN_HEAD_BRANCH"
              if [[ "$WORKFLOW_RUN_CONCLUSION" != "success" ]]; then
                echo "CI conclusion was ${WORKFLOW_RUN_CONCLUSION}; skipping deploy."
                set_output deploy false
                exit 0
              fi
              case "$branch" in
                main|master) ;;
                *)
                  echo "CI passed on ${branch}, not main/master; skipping deploy."
                  set_output deploy false
                  exit 0
                  ;;
              esac
              sha="$WORKFLOW_RUN_HEAD_SHA"
              ;;
            workflow_dispatch)
              branch="${DISPATCH_BRANCH:-main}"
              case "$branch" in
                main|master) ;;
                *)
                  echo "::error::Manual Hetzner deploy branch must be main or master, got ${branch}."
                  exit 1
                  ;;
              esac
              run_json="$(
                gh run list \
                  -R "$REPOSITORY" \
                  --workflow "CI" \
                  --branch "$branch" \
                  --status success \
                  --limit 1 \
                  --json databaseId,headSha,url
              )"
              if [[ "$(jq 'length' <<< "$run_json")" -eq 0 ]]; then
                echo "::error::No successful CI run found for ${branch}; refusing to deploy an unverified commit."
                exit 1
              fi
              sha="$(jq -r '.[0].headSha // ""' <<< "$run_json")"
              run_id="$(jq -r '.[0].databaseId // ""' <<< "$run_json")"
              run_url="$(jq -r '.[0].url // ""' <<< "$run_json")"
              if [[ -z "$sha" || "$sha" == "null" ]]; then
                echo "::error::Latest successful CI run for ${branch} did not include a head SHA."
                exit 1
              fi
              echo "::notice::Manual dispatch resolved latest successful CI run ${run_id} for ${branch}: ${sha} (${run_url})"
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}."
              exit 1
              ;;
          esac

          set_output deploy true
          set_output deploy_branch "$branch"
          set_output deploy_sha "$sha"

  deploy:
    name: Deploy (${{ matrix.role }})
    needs: resolve-deploy
    runs-on: ubuntu-latest
    if: needs.resolve-deploy.outputs.deploy == 'true'
    permissions:
      contents: read
    strategy:
      # One box failing must not cancel the deploy to the other.
      fail-fast: false
      matrix:
        role: [trading, research]
    steps:
      # Check out the exact commit that passed CI (not the branch tip, which may
      # have advanced) so the deploy script and the box deploy the same SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-deploy.outputs.deploy_sha }}

      # The box serves haskell/web/dist via Caddy; it is gitignored, so build it
      # here and rsync it to the box (matches the existing local-build flow).
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: haskell/web/package-lock.json

      - name: Build web frontend
        env:
          VITE_GIT_COMMIT: ${{ needs.resolve-deploy.outputs.deploy_sha }}
        run: |
          npm --workspaces=false --prefix haskell/web ci
          npm --prefix haskell/web run build

      - name: Deploy to Hetzner (${{ matrix.role }}) over SSH
        env:
          # Shared deploy key (same public key on both boxes' authorized_keys).
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          # Per-role hosts / pinned host keys (secret context can't be indexed by
          # matrix value, so expose both and select with a case below).
          HETZNER_TRADING_HOST: ${{ secrets.HETZNER_TRADING_HOST }}
          HETZNER_RESEARCH_HOST: ${{ secrets.HETZNER_RESEARCH_HOST }}
          HETZNER_TRADING_KNOWN_HOSTS: ${{ secrets.HETZNER_TRADING_KNOWN_HOSTS }}
          HETZNER_RESEARCH_KNOWN_HOSTS: ${{ secrets.HETZNER_RESEARCH_KNOWN_HOSTS }}
          # Optional shared Binance credentials. When set, both Hetzner roles get
          # the same Binance key pair, so both derive the same tenant key.
          HETZNER_BINANCE_API_KEY: ${{ secrets.HETZNER_BINANCE_API_KEY }}
          HETZNER_BINANCE_API_SECRET: ${{ secrets.HETZNER_BINANCE_API_SECRET }}
          # Backward-compatible fallback: these are also applied to both roles
          # when the shared names above are not configured.
          HETZNER_TRADING_BINANCE_API_KEY: ${{ secrets.HETZNER_TRADING_BINANCE_API_KEY }}
          HETZNER_TRADING_BINANCE_API_SECRET: ${{ secrets.HETZNER_TRADING_BINANCE_API_SECRET }}
          # Optional overrides; fall back to deploy-remote.sh defaults
          # (root @ /opt/trader, env at deploy/hetzner/trader.env).
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          HETZNER_REPO_DIR: ${{ secrets.HETZNER_REPO_DIR }}
          HETZNER_ENV_FILE: ${{ secrets.HETZNER_ENV_FILE }}
          ROLE: ${{ matrix.role }}
          TRADER_GIT_COMMIT: ${{ needs.resolve-deploy.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          is_transient_ssh_failure() {
            grep -qiE "(ssh: connect to host .* (Connection timed out|Operation timed out|Connection refused|No route to host)|Connection timed out|Operation timed out|Connection refused|No route to host|Could not resolve hostname|Temporary failure in name resolution)" "$1"
          }

          case "$ROLE" in
            trading)
              host="${HETZNER_TRADING_HOST:-}"
              host_keys="${HETZNER_TRADING_KNOWN_HOSTS:-}"
              ;;
            research)
              host="${HETZNER_RESEARCH_HOST:-}"
              host_keys="${HETZNER_RESEARCH_KNOWN_HOSTS:-}"
              ;;
            *)
              echo "::error::Unknown role '$ROLE'"; exit 1 ;;
          esac

          if [[ -z "${HETZNER_SSH_KEY:-}" ]]; then
            echo "::error::HETZNER_SSH_KEY is required; refusing to skip the mandatory ${ROLE} deploy."
            exit 1
          fi
          if [[ -z "$host" ]]; then
            echo "::error::HETZNER_${ROLE^^}_HOST is required; refusing to skip the mandatory ${ROLE} deploy."
            exit 1
          fi
          if [[ -z "$host_keys" ]]; then
            echo "::error::HETZNER_${ROLE^^}_KNOWN_HOSTS is required; host-key TOFU is not permitted."
            exit 1
          fi

          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          deploy_log="$(mktemp)"
          env_overrides="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts" "$deploy_log" "$env_overrides"' EXIT

          printf '%s\n' "$HETZNER_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          port="${HETZNER_SSH_PORT:-22}"
          printf '%s\n' "$host_keys" > "$known_hosts"

          export TRADER_HETZNER_SSH_USER="${HETZNER_SSH_USER:-root}"
          export TRADER_HETZNER_SSH_PORT="$port"
          export TRADER_HETZNER_REPO_DIR="${HETZNER_REPO_DIR:-/opt/trader}"
          export TRADER_HETZNER_ENV_FILE="${HETZNER_ENV_FILE:-deploy/hetzner/trader.env}"
          # Checked-in, non-secret role overlay merged into the box's env file
          # on every deploy (missing file = no-op).
          export TRADER_HETZNER_MANAGED_ENV_FILE="deploy/hetzner/trader.${ROLE}.env.managed"
          export TRADER_HETZNER_SSH_KEY_FILE="$key_file"
          export TRADER_HETZNER_KNOWN_HOSTS="$known_hosts"
          export TRADER_HETZNER_SSH_CONNECT_TIMEOUT="${HETZNER_SSH_CONNECT_TIMEOUT:-10}"
          export TRADER_HETZNER_SSH_CONNECTION_ATTEMPTS="${HETZNER_SSH_CONNECTION_ATTEMPTS:-3}"
          export TRADER_GIT_COMMIT

          # Live trading derives its tenant key from BINANCE_API_KEY /
          # BINANCE_API_SECRET. Keep research on that same tenant by applying the
          # same shared/trading Binance credentials to both roles when CI has
          # them, and let the backend derive TRADER_STATE_SYNC_TENANT_KEY.
          : > "$env_overrides"
          printf 'TRADER_STATE_SYNC_TENANT_KEY=\n' >> "$env_overrides"
          binance_key="${HETZNER_BINANCE_API_KEY:-${HETZNER_TRADING_BINANCE_API_KEY:-}}"
          binance_secret="${HETZNER_BINANCE_API_SECRET:-${HETZNER_TRADING_BINANCE_API_SECRET:-}}"
          if [[ -n "$binance_key" || -n "$binance_secret" ]]; then
            if [[ -z "$binance_key" || -z "$binance_secret" ]]; then
              echo "::warning::Only one shared Hetzner Binance credential secret is set; leaving remote Binance credentials unchanged."
            else
              {
                printf 'BINANCE_API_KEY=%s\n' "$binance_key"
                printf 'BINANCE_API_SECRET=%s\n' "$binance_secret"
              } >> "$env_overrides"
            fi
          fi
          export TRADER_HETZNER_ENV_OVERRIDES_FILE="$env_overrides"

          deploy_status=0
          last_attempt=0
          for attempt in 1 2 3; do
            last_attempt="$attempt"
            : > "$deploy_log"
            set +e
            bash deploy/hetzner/deploy-remote.sh "$host" 2>&1 | tee "$deploy_log"
            deploy_status=${PIPESTATUS[0]}
            set -e

            if [[ "$deploy_status" -eq 0 ]]; then
              exit 0
            fi

            if is_transient_ssh_failure "$deploy_log" && [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Transient ${ROLE} Hetzner SSH failure on attempt ${attempt}; retrying."
              sleep "$((attempt * 10))"
              continue
            fi

            break
          done

          echo "::error::Hetzner ${ROLE} deploy failed after ${last_attempt} attempt(s)."
          exit "$deploy_status"
