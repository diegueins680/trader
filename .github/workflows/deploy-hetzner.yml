name: Deploy (Hetzner)

# Runs after the CI workflow finishes. Because it keys off the whole CI run's
# conclusion, it only deploys when every other CI job (haskell, web, automation)
# was green for that commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Never let two deploys race; let an in-flight deploy finish before the next.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (Hetzner)
    runs-on: ubuntu-latest
    # Only deploy a real pushed commit whose entire CI run passed, on main/master.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    permissions:
      contents: read
    steps:
      # Check out the exact commit that passed CI (not the branch tip, which may
      # have advanced) so the deploy script and the box deploy the same SHA.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Hetzner over SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_REPO_DIR: ${{ secrets.HETZNER_REPO_DIR }}
          HETZNER_ENV_FILE: ${{ secrets.HETZNER_ENV_FILE }}
          TRADER_GIT_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${HETZNER_SSH_KEY:-}" || -z "${HETZNER_HOST:-}" ]]; then
            echo "::warning::HETZNER_SSH_KEY / HETZNER_HOST are not set; skipping Hetzner deploy."
            exit 0
          fi

          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT

          printf '%s\n' "$HETZNER_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          port="${HETZNER_SSH_PORT:-22}"
          if [[ -n "${HETZNER_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$known_hosts"
          else
            echo "::warning::HETZNER_KNOWN_HOSTS not set; trusting the host key via ssh-keyscan (TOFU)."
            ssh-keyscan -p "$port" -H "$HETZNER_HOST" > "$known_hosts" 2>/dev/null || true
          fi

          export TRADER_HETZNER_SSH_USER="${HETZNER_SSH_USER:-root}"
          export TRADER_HETZNER_SSH_PORT="$port"
          export TRADER_HETZNER_REPO_DIR="${HETZNER_REPO_DIR:-/opt/trader}"
          export TRADER_HETZNER_ENV_FILE="${HETZNER_ENV_FILE:-deploy/hetzner/trader.env}"
          export TRADER_HETZNER_SSH_KEY_FILE="$key_file"
          export TRADER_HETZNER_KNOWN_HOSTS="$known_hosts"
          export TRADER_GIT_COMMIT

          bash deploy/hetzner/deploy-remote.sh "$HETZNER_HOST"
