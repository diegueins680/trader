# Temporary: records formal results for this branch; removed before merge.
name: Record formal results (temporary)
on:
  push:
    branches: [fix/live-trade-recording-20261113]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.3"
      - uses: haskell/ghcup-setup@v1
        with:
          ghc: "9.4.8"
          cabal: "3.12.1.0"
      - run: >-
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/formal/requirements.txt
      - run: python3 scripts/formal/verify.py --record
      - if: always()
        run: git status --short && git diff > formal-record.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formal-record
          path: formal-record.patch
          retention-days: 3
