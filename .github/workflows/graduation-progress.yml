name: Read graduation probe progress
on:
  push:
    branches: [ops/graduation-runtime-20261027]
    paths: [.github/workflows/graduation-progress.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed probe progress file
        env:
          PROBE_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          PROBE_HOST: ${{ secrets.HETZNER_TRADING_HOST }}
          PROBE_HOST_KEYS: ${{ secrets.HETZNER_TRADING_KNOWN_HOSTS }}
          PROBE_USER: ${{ secrets.HETZNER_SSH_USER }}
          PROBE_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$PROBE_SSH_KEY"
          test -n "$PROBE_HOST"
          test -n "$PROBE_HOST_KEYS"
          key_file="$(mktemp)"
          host_keys="$(mktemp)"
          trap 'rm -f "$key_file" "$host_keys"' EXIT
          printf '%s\n' "$PROBE_SSH_KEY" > "$key_file"
          printf '%s\n' "$PROBE_HOST_KEYS" > "$host_keys"
          chmod 600 "$key_file" "$host_keys"
          ssh -i "$key_file" -p "${PROBE_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$host_keys" -o ConnectTimeout=20 \
            "${PROBE_USER:-root}@$PROBE_HOST" \
            'docker exec -i trader-api-1 node' <<'JS'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/trader-fleet-diagnostic-graduation-trace-20261027-progress.json','utf8'));
          const samples=p.samples??p.warmup??[];
          console.log('GRADUATION_PROBE_PROGRESS_JSON='+JSON.stringify({phase:p.phase,warmupCount:samples.length,first:samples[0],latest:samples.at(-1),benchmarkCompleted:!!p.benchmark}));
          JS
