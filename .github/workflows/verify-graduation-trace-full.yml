name: Verify graduation query timing with full wrapper
on:
  push:
    branches: [diagnostics/graduation-query-timing]
    paths:
      - .github/workflows/verify-graduation-trace-full.yml
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trader_test
          POSTGRES_PASSWORD: trader_test_only
          POSTGRES_DB: trader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader_test -d trader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credentials belong only to this disposable CI service.
      TRADER_TEST_DB_URL: "host=127.0.0.1 port=5432 dbname=trader_test user=trader_test password=trader_test_only"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.3"

      - uses: haskell/ghcup-setup@v1
        with:
          ghc: "9.4.8"
          cabal: "3.12.1.0"

      - name: Restore Cabal cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            haskell/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('haskell/trader.cabal') }}-${{ hashFiles('haskell/app/**') }}
          restore-keys: |
            ${{ runner.os }}-cabal-${{ hashFiles('haskell/trader.cabal') }}-
            ${{ runner.os }}-cabal-

      - name: Install HLint
        run: |
          hlint_archive="$RUNNER_TEMP/hlint-3.8-linux.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/ndmitchell/hlint/releases/download/v3.8/hlint-3.8-x86_64-linux.tar.gz \
            --output "$hlint_archive"
          echo "882363872064c70801858b4e9fa17468531fc30b91ed5b8d260eb48fc90b3e61  $hlint_archive" | sha256sum --check --strict
          tar -xzf "$hlint_archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/hlint-3.8/hlint" --version
          echo "$RUNNER_TEMP/hlint-3.8" >> "$GITHUB_PATH"

      - name: Install fourmolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location \
            --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/fourmolu/fourmolu/releases/download/v0.15.0.0/fourmolu-0.15.0.0-linux-x86_64 \
            --output "$HOME/.local/bin/fourmolu"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show fourmolu version
        run: fourmolu --version

      - run: cd haskell && cabal update
      - name: Install isolated formal and automation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/graduation-trace-formal"
          echo "TRADER_FORMAL_PYTHON=$RUNNER_TEMP/graduation-trace-formal/bin/python3" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/graduation-trace-formal/bin/python3" -m pip install --require-hashes --only-binary=:all: -r scripts/formal/requirements.txt
          python3 -m pip install -r scripts/research/sequential-requirements.txt
      - run: npm --workspaces=false --prefix haskell/web ci
      - name: Record exact scoped receipt before canonical full verification
        run: |
          "$TRADER_FORMAL_PYTHON" scripts/formal/verify.py --record
          python3 - <<'PYRECEIPT'
          import base64,gzip,hashlib
          from pathlib import Path
          raw=Path('formal/research/results.json').read_bytes()
          print('GRADUATION_RECEIPT_SHA256='+hashlib.sha256(raw).hexdigest())
          print('GRADUATION_RECEIPT_GZIP_BASE64='+base64.b64encode(gzip.compress(raw)).decode())
          PYRECEIPT
      - run: bash scripts/verify.sh full
