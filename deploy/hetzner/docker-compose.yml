      TRADER_STATE_S3_REGION: ${TRADER_STATE_S3_REGION:-}
      TRADER_STATE_S3_PREFIX: ${TRADER_STATE_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      TRADER_TOP_COMBOS_SYNC_ENABLED: ${TRADER_TOP_COMBOS_SYNC_ENABLED:-true}
      TRADER_TOP_COMBOS_SYNC_EVERY_SEC: ${TRADER_TOP_COMBOS_SYNC_EVERY_SEC:-60}
      TRADER_TOP_COMBOS_SYNC_INITIAL_DELAY_SEC: ${TRADER_TOP_COMBOS_SYNC_INITIAL_DELAY_SEC:-0}
      TRADER_TOP_COMBOS_SYNC_MAX_COMBOS: ${TRADER_TOP_COMBOS_SYNC_MAX_COMBOS:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      COINBASE_API_KEY: ${COINBASE_API_KEY:-}
      COINBASE_API_SECRET: ${COINBASE_API_SECRET:-}
      COINBASE_API_PASSPHRASE: ${COINBASE_API_PASSPHRASE:-}
      TRADER_WEBHOOK_URL: ${TRADER_WEBHOOK_URL:-}
      TRADER_WEBHOOK_EVENTS: ${TRADER_WEBHOOK_EVENTS:-bot.started,bot.start_failed,bot.stop,bot.order,bot.halt,trade.order}
    volumes:
      - trader-state:/var/lib/trader

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TRADER_SITE_ADDRESS: ${TRADER_SITE_ADDRESS:-http://localhost}
      TRADER_API_TOKEN: ${TRADER_API_TOKEN:?set TRADER_API_TOKEN in deploy/hetzner/trader.env}
      TRADER_UI_BASIC_AUTH_USER: ${TRADER_UI_BASIC_AUTH_USER:-trader}
      TRADER_UI_BASIC_AUTH_HASH: ${TRADER_UI_BASIC_AUTH_HASH:?set TRADER_UI_BASIC_AUTH_HASH in deploy/hetzner/trader.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./${TRADER_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ../../haskell/web/dist:/srv/trader-web:ro
      - caddy-data:/data
      - caddy-config:/config

  webhook-bridge:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./webhook-bridge/bridge.py:/app/bridge.py:ro
    environment:
      ALERT_PHONE: ${ALERT_PHONE:-}
      CALLMEBOT_APIKEY: ${CALLMEBOT_APIKEY:-}
    command: python /app/bridge.py
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  trader-postgres:
    name: ${TRADER_POSTGRES_VOLUME:-trader-postgres}
  trader-state:
    name: ${TRADER_STATE_VOLUME:-trader-state}
  caddy-data:
    name: ${TRADER_CADDY_DATA_VOLUME:-trader-caddy-data}
  caddy-config:
    name: ${TRADER_CADDY_CONFIG_VOLUME:-trader-caddy-config}
