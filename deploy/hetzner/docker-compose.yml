name: ${COMPOSE_PROJECT_NAME:-trader}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trader}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/hetzner/trader.env}
    volumes:
      - trader-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        TRADER_GIT_COMMIT: ${TRADER_GIT_COMMIT:-}
    image: ${TRADER_API_IMAGE:-trader-api:local}
    command:
      - /bin/sh
      - -ec
      - |
        set -- trader-hs --serve --port 8080 --platform binance --futures --trade-log .tmp/trader/live_trades.ndjson
        case "$${TRADER_BINANCE_LIVE:-false}" in
          true|TRUE|1) set -- "$$@" --binance-live ;;
          false|FALSE|0|"") ;;
          *) echo "TRADER_BINANCE_LIVE must be true/false/1/0" >&2; exit 64 ;;
        esac
        exec "$$@"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRADER_API_TOKEN: ${TRADER_API_TOKEN:?set TRADER_API_TOKEN in deploy/hetzner/trader.env}
      TRADER_DB_URL: ${TRADER_DB_URL:?set TRADER_DB_URL in deploy/hetzner/trader.env}
      TRADER_SERVER_ID: ${TRADER_SERVER_ID:-hetzner}
      TRADER_SERVER_ROLE: ${TRADER_SERVER_ROLE:-standalone}
      TRADER_SERVER_PROVIDER: ${TRADER_SERVER_PROVIDER:-hetzner}
      TRADER_MULTI_USER: ${TRADER_MULTI_USER:-true}
      TRADER_STATE_DIR: /var/lib/trader/state
      TRADER_API_ASYNC_DIR: /var/lib/trader/async
      TRADER_LSTM_WEIGHTS_DIR: /var/lib/trader/lstm
      TRADER_BOT_STATE_DIR: /var/lib/trader/state/bots
      TRADER_OPTIMIZER_COMBOS_DIR: /var/lib/trader/state/optimizer
      TRADER_JOURNAL_DIR: /var/lib/trader/state/journal
      TRADER_BINANCE_LIVE: ${TRADER_BINANCE_LIVE:-false}
      TRADER_BOT_TRADE: ${TRADER_BOT_TRADE:-false}
      TRADER_BOT_AUTOSTART: ${TRADER_BOT_AUTOSTART:-true}
      TRADER_BOT_SYMBOLS: ${TRADER_BOT_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      TRADER_BOT_TOP_COMBO_BOTS: ${TRADER_BOT_TOP_COMBO_BOTS:-3}
      TRADER_BOT_TOP_COMBO_BOTS_STARTUP: ${TRADER_BOT_TOP_COMBO_BOTS_STARTUP:-3}
      TRADER_BOT_AUTOSTART_MAX_BOTS: ${TRADER_BOT_AUTOSTART_MAX_BOTS:-3}
      TRADER_BOT_AUTOSTART_MAX_STARTS_PER_CYCLE: ${TRADER_BOT_AUTOSTART_MAX_STARTS_PER_CYCLE:-1}
      TRADER_BOT_START_MAX_SYMBOLS: ${TRADER_BOT_START_MAX_SYMBOLS:-3}
