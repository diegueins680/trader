app = "trader-hs-research"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADER_SERVER_ID = "fly-trader-hs-research"
  TRADER_SERVER_ROLE = "research"
  TRADER_SERVER_PROVIDER = "fly"

  # Research producer: reserve capacity for optimizer discovery, not paper bots.
  TRADER_BOT_SYMBOLS = ""
  TRADER_BOT_AUTOSTART = "false"
  TRADER_BOT_TRADE = "false"
  TRADER_BOT_TOP_COMBO_BOTS = "0"
  TRADER_BOT_TOP_COMBO_BOTS_STARTUP = "0"
  TRADER_BOT_AUTOSTART_MAX_BOTS = "0"
  TRADER_BOT_AUTOSTART_MAX_STARTS_PER_CYCLE = "1"
  TRADER_BOT_START_MAX_SYMBOLS = "1"

  # This node OWNS optimization/backtesting (heavier than the trading node).
  TRADER_OPTIMIZER_ENABLED = "true"
  TRADER_OPTIMIZER_EVERY_SEC = "900"
  # Fewer, heavier trials: the incumbent leaderboard lives at epochs ~8 /
  # hidden ~29, unreachable under the old epochs<=2 / hidden<=16 sampling.
  # Long-horizon all-predictor trials are expensive. Small recurring batches
  # publish completed evidence promptly; eligibility gates remain unchanged.
  TRADER_OPTIMIZER_TRIALS = "4"
  TRADER_OPTIMIZER_TIMEOUT_SEC = "480"
  TRADER_OPTIMIZER_DISCOVERY_RECOVERY_TRIALS = "6"
  TRADER_OPTIMIZER_EPOCHS_MAX = "12"
  TRADER_OPTIMIZER_HIDDEN_SIZE_MAX = "48"
  # A 20% OOS split over 1,100 days yields about 220 daily observations,
  # clearing the production selector's 180-day evidence floor. Restricting
  # intervals to 6h+ keeps every scope within the 5,000-point process cap.
  TRADER_OPTIMIZER_LOOKBACK_WINDOW = "1100d"
  TRADER_OPTIMIZER_LOOKBACK_WINDOWS = "1100d"
  TRADER_OPTIMIZER_AUTO_CAPPED_LOOKBACKS = "true"
  TRADER_OPTIMIZER_INTERVALS = "6h,12h,1d"
  TRADER_OPTIMIZER_MAX_POINTS = "5000"
  TRADER_OPTIMIZER_MAX_COMBOS = "5000"
  # Enrich discovery trials with same-asset Coinbase data (basis/lead-lag) for
  # Coinbase-eligible symbols/intervals; fail-open to Binance-only otherwise.
  TRADER_OPTIMIZER_CROSS_EXCHANGE_COINBASE = "true"
  TRADER_TOP_COMBOS_BACKTEST_ENABLED = "false"
  TRADER_TOP_COMBO_SCORE_FRESHNESS_HALF_LIFE_DAYS = "30"
  TRADER_TOP_COMBO_SCORE_FRESHNESS_FLOOR_MULTIPLIER = "0.10"
  TRADER_OPTIMIZER_PRIOR_MISSING_AGE_MULTIPLIER = "0.10"
  TRADER_OPTIMIZER_P_LONG_SHORT = "0.2"
  TRADER_OPTIMIZER_P_COST_AWARE_EDGE = "1.0"

  # Cross-instance combo sync — SAME bucket + prefix as trader-hs / Hetzner / local.
  # Credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) are set via `fly secrets`.
  TRADER_STATE_S3_ENDPOINT = "https://fly.storage.tigris.dev"
  TRADER_STATE_S3_REGION = "auto"
  TRADER_STATE_S3_BUCKET = "broken-thunder-8987"
  TRADER_STATE_S3_PREFIX = "trader-prod"
  TRADER_TOP_COMBOS_SYNC_ENABLED = "true"
  TRADER_TOP_COMBOS_SYNC_EVERY_SEC = "60"
  TRADER_TOP_COMBOS_SYNC_MAX_COMBOS = "5000"
  # Distinct tenant so this node's paper-bot snapshots don't collide with the
  # live trading node's (combos themselves are not tenant-scoped, so they're shared).
  TRADER_STATE_SYNC_TENANT_KEY = "fly-research"

# Run the serve process in FUTURES market: the top combos use long-short
# positioning, which requires market=futures (spot serve rejects them).
[processes]
  app = "trader-hs --serve --port 8080 --futures --trade-log .tmp/trader/live_trades.ndjson"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "performance-8x"
  memory = "16384mb"
