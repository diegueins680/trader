app = "trader-hs"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADER_BOT_SYMBOLS = "AAVEUSDT,ARBUSDT,ATOMUSDT,AVAXUSDT,BCHUSDT,BTCUSDT,DOGEUSDT,DOTUSDT,ETHUSDT,FILUSDT"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
