app = "trader-hs"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[build]
  dockerfile = "Dockerfile"

[env]
  TRADER_SERVER_ID = "fly-trader-hs"
  TRADER_SERVER_ROLE = "read-only"
  TRADER_SERVER_PROVIDER = "fly"
  # Hetzner is the sole live order executor. This backend remains available as
  # a read-only standby and must never claim or trade its exchange positions.
  TRADER_BOT_TRADE = "false"
  TRADER_BOT_SYMBOLS = "XRPUSDT,FILUSDT,DOGEUSDT,ADAUSDT,SOLUSDT,AAVEUSDT,UNIUSDT,ETHUSDT,BTCUSDT,BNBUSDT,LTCUSDT,LINKUSDT,SUIUSDT,ATOMUSDT,ARBUSDT,AVAXUSDT,DOTUSDT,ETCUSDT,NEARUSDT,OPUSDT,BCHUSDT"
  TRADER_BOT_TOP_COMBO_BOTS = "3"
  TRADER_BOT_TOP_COMBO_BOTS_STARTUP = "3"
  TRADER_BOT_AUTOSTART_MAX_BOTS = "3"
  TRADER_BOT_AUTOSTART_MAX_STARTS_PER_CYCLE = "1"
  TRADER_BOT_START_MAX_SYMBOLS = "1"
  TRADER_BOT_START_TOP_COMBO_ADOPTION = "true"
  TRADER_BOT_START_FORCE_ENV_PRESET = "false"
  TRADER_PORTFOLIO_SELECTOR_ROLLOUT_MODE = "enforce"
  TRADER_PORTFOLIO_SELECTOR_MAX_BOTS = "3"
  TRADER_PORTFOLIO_SELECTOR_MAX_BOT_WEIGHT = "0.25"
  TRADER_PORTFOLIO_SELECTOR_MAX_GROSS_WEIGHT = "0.75"
  TRADER_PORTFOLIO_SELECTOR_MAX_DRAWDOWN = "0.10"
  TRADER_PORTFOLIO_SELECTOR_MIN_DAYS = "180"
  TRADER_PORTFOLIO_SELECTOR_BOOTSTRAP_SAMPLES = "1000"
  TRADER_PORTFOLIO_SELECTOR_BLOCK_DAYS = "7"
  TRADER_PORTFOLIO_SELECTOR_ROTATION_IMPROVEMENT = "0.02"
  TRADER_PORTFOLIO_SELECTOR_ROTATION_PROBABILITY = "0.90"
  TRADER_CROSS_EXCHANGE_COINBASE = "true"
  # Trading-only node: optimization/backtesting runs on trader-hs-research (and
  # Hetzner research). This node pulls the best combos from the Tigris bus and
  # applies them to the live bots. See fly.research.toml + deploy/COMBOS_SYNC.md.
  TRADER_OPTIMIZER_ENABLED = "false"
  TRADER_OPTIMIZER_MAX_POINTS = "2000"
  TRADER_OPTIMIZER_MAX_COMBOS = "5000"
  TRADER_TOP_COMBOS_BACKTEST_ENABLED = "false"
  # --- Cross-instance combo sync (shared S3 bus: Tigris, S3-compatible) ---
  # Provision with `fly storage create` (see deploy/COMBOS_SYNC.md). That command
  # auto-sets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as app secrets and creates the
  # bucket; put the bucket name it prints into TRADER_STATE_S3_BUCKET below.
  # TRADER_STATE_S3_PREFIX MUST be identical on fly, Hetzner, and local — the combos
  # key (<prefix>/optimizer/top-combos.json) is not tenant-scoped, so a shared prefix
  # = one shared global leaderboard.
  TRADER_STATE_S3_ENDPOINT = "https://fly.storage.tigris.dev"
  TRADER_STATE_S3_REGION = "auto"
  TRADER_STATE_S3_BUCKET = "broken-thunder-8987"
  TRADER_STATE_S3_PREFIX = "trader-prod"
  TRADER_TOP_COMBOS_SYNC_ENABLED = "true"
  TRADER_TOP_COMBOS_SYNC_EVERY_SEC = "60"
  TRADER_TOP_COMBOS_SYNC_INITIAL_DELAY_SEC = "30"
  TRADER_TOP_COMBOS_SYNC_MAX_COMBOS = "5000"
  # Every writer on the shared production bus retains the live fleet records.
  TRADER_TOP_COMBOS_RETAIN_UUIDS = "efe1c81e-2094-c945-af30-8bf25a554157,da78765a-657f-5589-af9c-d289555660cc,62c95834-cbb5-7dba-a5b9-25594e9df953,76a9c22a-45ff-94b9-067f-f3d3c7b8350f,9a50374e-f0ba-f495-bb4b-2bf3c4478921,bc1abfd5-ebce-22cd-ec1f-798e3ce2595f,35a1c1f6-58ad-5bd4-0ae9-5d8513372261,a9974fcf-5e6d-e068-bfac-000e85f79054,ced37172-1552-1b1b-be6d-4816b162654b,a742d6ca-35f6-9d0e-1730-1046b2148de3,05081a5e-18b2-826c-d3b0-1ce92dfecc36,7b7cbf5e-e185-1b7b-9424-1d65a9e22d07,326e5ae0-734a-d55b-157d-e72ba5405790,7a6d8382-1721-e94b-3687-83acd59f72b8,9d121903-9ec9-673d-cc35-b79c033b671b,fdde9030-a258-aec8-3029-40bd5325bf66,a7966572-3bae-f810-8c2a-1d062c189d24,4d506e36-2922-0643-615b-dc2192d68c46"
  # Position recovery uses the latest compatible volume-backed model
  # immediately; online closed-trade learning keeps saving newer weights.
  TRADER_LSTM_REUSE_PERSISTED = "true"
  RADIO_STATIONS_FILE = "/var/lib/trader/state/radio-stations.json"
  RADIO_STATION_DISCOVERY_URLS = "https://all.api.radio-browser.info/json/stations/topclick/500?hidebroken=true"
  RADIO_STATION_INTERVAL_SECONDS = "900"
  RADIO_STATION_MAX_FAILURES = "2"
  RADIO_STATION_CHECK_TIMEOUT_MS = "8000"
  RADIO_STATION_CHECK_CONCURRENCY = "8"

[processes]
  app = "trader-hs --serve --port 8080 --platform binance --futures --trade-log .tmp/trader/live_trades.ndjson"
  radio = "sh /usr/local/bin/fly-radio-stations-loop"

[[mounts]]
  source = "trader_data"
  destination = "/var/lib/trader"
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/ready"

[[vm]]
  size = "performance-8x"
  memory = "16384mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["radio"]
