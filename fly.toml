app = "trader-hs"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADER_BOT_SYMBOLS = "XRPUSDT,FILUSDT,DOGEUSDT,ADAUSDT,SOLUSDT,AAVEUSDT,UNIUSDT,ETHUSDT,BTCUSDT,BNBUSDT,LTCUSDT,LINKUSDT,SUIUSDT,ATOMUSDT,ARBUSDT,AVAXUSDT,DOTUSDT,ETCUSDT,NEARUSDT,OPUSDT,BCHUSDT"
  TRADER_BOT_TOP_COMBO_BOTS = "22"
  TRADER_BOT_TOP_COMBO_BOTS_STARTUP = "0"
  TRADER_BOT_AUTOSTART_MAX_BOTS = "22"
  TRADER_BOT_AUTOSTART_MAX_STARTS_PER_CYCLE = "5"
  TRADER_BOT_START_MAX_SYMBOLS = "1"
  TRADER_OPTIMIZER_ENABLED = "true"
  TRADER_OPTIMIZER_EVERY_SEC = "900"
  TRADER_OPTIMIZER_TRIALS = "60"
  TRADER_OPTIMIZER_TIMEOUT_SEC = "90"
  TRADER_OPTIMIZER_LOOKBACK_WINDOW = "30d"
  TRADER_OPTIMIZER_MAX_POINTS = "2000"
  TRADER_TOP_COMBOS_BACKTEST_ENABLED = "true"
  RADIO_STATIONS_FILE = "/var/lib/trader/state/radio-stations.json"
  RADIO_STATION_DISCOVERY_URLS = "https://all.api.radio-browser.info/json/stations/topclick/500?hidebroken=true"
  RADIO_STATION_INTERVAL_SECONDS = "900"
  RADIO_STATION_MAX_FAILURES = "2"
  RADIO_STATION_CHECK_TIMEOUT_MS = "8000"
  RADIO_STATION_CHECK_CONCURRENCY = "8"

[processes]
  app = "trader-hs --serve --port 8080"
  radio = "sh /usr/local/bin/fly-radio-stations-loop"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "performance-8x"
  memory = "16384mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["radio"]
