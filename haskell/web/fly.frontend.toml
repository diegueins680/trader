app = "trader-web-hs"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  TRADER_API_ORIGIN = "https://trader-hs.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
